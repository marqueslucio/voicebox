name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck dictation app
        run: bun run typecheck

      - name: Test dictation helpers
        run: bun test app/src

      - name: Build dictation frontend
        run: bun run --cwd tauri build
